<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuentas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark navbar-fin">
    <div class="container">
      <a class="navbar-brand" href="index.html"> Gastos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link " href="index.html"> Usuarios</a></li>
          <li class="nav-item"><a class="nav-link active" href="cuentas.html"> Cuentas</a></li>
          <li class="nav-item"><a class="nav-link " href="movimientos.html"> Movimientos</a></li>
      </ul>
      </div>
    </div>
  </nav>

  <div id="contenedorAlertas"></div>

  <main class="container pb-5">
    <div class="encabezado">
      <h1> Cuentas</h1>
    <p>administra las cuentas de efectivo, bancarias o tarjetas de cada usuario aqui</p>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <div class="tarjeta p-3 h-100">
      <label class="form-label" for="selectUsuario"> Usuario</label>
          <div class="d-flex gap-2">
      <select id="selectUsuario" class="form-select"></select>
            <button id="btnNueva" class="btn btn-fin text-nowrap" disabled> nueva cuenta: </button>
      </div>
       </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="tarjeta stat h-100">
          <div class="icono bg-info-fin"></div>
       <div><small>Cuentas</small><h3 id="totalCuentas">0</h3></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="tarjeta stat h-100">
          <div class="icono bg-saldo"></div>
    <div><small>Saldo total</small><h3 id="saldoTotal">$0.00</h3></div>
        </div>
      </div>
    </div>

    <div class="tarjeta overflow-hidden">
      <div class="table-responsive">
    <table class="table table-hover align-middle">
          <thead>
     <tr><th>#</th><th>Nombre</th><th>Tipo</th><th>Saldo inicial</th><th>Saldo actual</th><th>Estado</th><th class="text-end">Acciones</th></tr>
          </thead>
          <tbody id="tablaCuentas"></tbody>
   </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalCuenta" tabindex="-1">
   <div class="modal-dialog modal-dialog-centered">
      <form id="formCuenta" class="modal-content" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModal">Nueva cuenta</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="idCuenta">
          <div class="mb-3">
            <label class="form-label" for="nombre">Nombre de la cuenta</label>
            <input type="text" id="nombre" class="form-control" maxlength="100" placeholder="Ejemplo: Cuenta de ahorros">
          </div>
          <div class="mb-3">
            <label class="form-label" for="tipo">Tipo</label>
            <select id="tipo" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="saldoInicial">Saldo inicial en $</label>
            <input type="number" id="saldoInicial" class="form-control" min="0" step="0.01" placeholder="0.00">
         </div>

       <div class="mb-3 d-none" id="grupoActiva">
         <label class="form-label" for="activa">Estado</label>
           <select id="activa" class="form-select">
            <option value="S">Activa</option>
              <option value="N">Inactiva ahora (requiere saldo $0.00)</option>
            </select>
          </div>
        </div>
      <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-fin"><i class="bi bi-check2"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controllers/cuentasController.js"></script>
</body>
</html>
